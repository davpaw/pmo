name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove the scanner rejects a synthetic credential
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/leak-probe"
          python3 - <<'PY' > "$RUNNER_TEMP/leak-probe/probe.txt"
          import random, string
          rng = random.Random(619)
          print('token = "' + 'ghp_' + ''.join(rng.choice(string.ascii_letters + string.digits) for _ in range(40)) + '"')
          PY
          set +e
          docker run --rm -v "$RUNNER_TEMP/leak-probe:/probe:ro" "$GITLEAKS_IMAGE" dir /probe --redact --exit-code 42
          result=$?
          set -e
          rm -rf "$RUNNER_TEMP/leak-probe"
          test "$result" -eq 42
      - name: Scan every new commit, including a credential later deleted in the same PR
        shell: bash
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          docker run --rm -v "$PWD:/repo:ro" -e BASE_SHA -e HEAD_SHA --entrypoint /bin/sh "$GITLEAKS_IMAGE" -c '
            git config --global --add safe.directory /repo
            if [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
              range="$HEAD_SHA"
            else
              range="$BASE_SHA..$HEAD_SHA"
            fi
            exec gitleaks git /repo --redact --exit-code 1 --log-opts="$range"
          '
